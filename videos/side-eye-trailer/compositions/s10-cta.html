      <script>
        const tl = gsap.timeline({ paused: true });
        const R = "#root ";
        const P = 0.5697;
        const B = (n) => n * P;
        tl.fromTo(R + ".s10-glow", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power3.out" }, 0);
        tl.fromTo(R + ".s10-word", { opacity: 0, scale: 1.35, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" }, B(0));
        tl.fromTo(R + ".s10-kick", { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, B(1));
        tl.fromTo(R + ".s10-btn", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, B(2));
        tl.fromTo(R + ".s10-url", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, B(3));
        tl.fromTo(R + ".s10-under", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, B(3.5));
        tl.fromTo(R + ".s10-foot", { opacity: 0 }, { opacity: 1, duration: 0.4 }, B(4));
        // The family steps in from both sides, on the off-beats.
        [[1, -260], [3, 260], [2, -200], [4, 200]].forEach(([k, dx], i) => {
          tl.fromTo(R + ".s10-p" + k, { opacity: 0, x: dx }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, B(4.5 + i * 0.5));

        // The press: the cursor decelerates in, lands a little off-centre, the button compresses with it.

        tl.to([R + ".s10-btn", R + ".s10-cur"], { scale: 0.9, duration: 0.09, ease: "power1.in" }, B(8.6));
        tl.to([R + ".s10-btn", R + ".s10-cur"], { scale: 1, duration: 0.35, ease: "back.out(3)" }, B(8.6) + 0.09);
        tl.fromTo(R + ".s10-ring", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 2.4, duration: 0.6, ease: "power2.out" }, B(8.6) + 0.05);
        tl.fromTo(R + ".s10-btn", { boxShadow: "10px 12px 0 rgba(20,10,18,.9)" }, { boxShadow: "10px 12px 0 rgba(20,10,18,.9), 0 0 90px rgba(242,181,60,.85)", duration: 0.3, yoyo: true, repeat: 1 }, B(8.6) + 0.1);

        tl.fromTo(R + ".s10-p1", { y: 0 }, { y: -18, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, B(12));
        // The hold stays alive on the beat: the button pulses every two beats, the glow breathes.
        const pulseFrom = B(14), cycle = 2 * P;
        tl.to(R + ".s10-btnwrap", { scale: 1.05, duration: cycle / 2, ease: "sine.inOut", yoyo: true, repeat: Math.max(0, Math.floor((13.4 - pulseFrom) / (cycle / 2)) - 1) }, pulseFrom);
        tl.to(R + ".s10-glow", { scale: 1.08, opacity: 0.8, duration: 1.7, ease: "sine.inOut", yoyo: true, repeat: 2 }, 7.2);
        tl.fromTo(R + ".s10-url", { boxShadow: "0 0 0 rgba(242,181,60,0)" }, { boxShadow: "0 0 46px rgba(242,181,60,.55)", duration: cycle, ease: "sine.inOut", yoyo: true, repeat: 3 }, B(15));
        // Final scene only: a slow fade to black.
        tl.fromTo(R + ".s10-black", { opacity: 0 }, { opacity: 1, duration: 1.1, ease: "power1.in" }, 13.4);
        window.__timelines["s10-cta"] = tl;
