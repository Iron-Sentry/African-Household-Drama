      <script>
        const tl = gsap.timeline({ paused: true });
        const R = "#root ";
        // Shot A: Mummy watching the TV, a slow push; then the eyes move.
        tl.fromTo(R + ".s2-mum", { scale: 1, x: 0 }, { scale: 1.1, x: -20, duration: 2.6, ease: "none" }, 0);
        tl.set(R + ".s2-mum.eye", { opacity: 1 }, 1.0);
        tl.set(R + ".s2-mum.idle", { opacity: 0 }, 1.0); // one Mummy on screen at a time, never two
        tl.fromTo(R + ".s2-mum.eye", { scale: 1.1 }, { scale: 1.2, duration: 0.18, ease: "power4.out" }, 1.0);
        tl.fromTo(R + ".s2-red", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 1.0);
        tl.fromTo(R + ".s2-l1", { opacity: 0, scale: 1.4, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" }, 1.05);
        tl.fromTo(R + ".s2-l2", { opacity: 0, x: -260 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 1.45);
        tl.fromTo(R + ".s2-hmm", { opacity: 0, scale: 0, rotation: -14 }, { opacity: 1, scale: 1, rotation: 6, duration: 0.42, ease: "back.out(1.8)" }, 1.75);
        // Shot B (hard cut on the throat-clear): Daddy, same verdict.
        tl.set(R + ".s2-dadshot", { opacity: 1 }, 2.55);
        tl.set(R + ".s2-mumshot", { opacity: 0 }, 2.55);
        tl.fromTo(R + ".s2-dad", { scale: 1.12 }, { scale: 1.02, duration: 2.0, ease: "power2.out" }, 2.55);
        tl.fromTo(R + ".s2-b", { opacity: 0, scale: 0.4, rotation: -4 }, { opacity: 1, scale: 1, rotation: -2, duration: 0.35, ease: "back.out(2)" }, 2.65);
        tl.fromTo(R + ".s2-l3", { opacity: 0, y: 80, rotation: 4 }, { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: "circ.out" }, 3.15);
        tl.fromTo(R + ".s2-l4", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power4.out" }, 3.5);
        window.__timelines["s02-sideeye"] = tl;
